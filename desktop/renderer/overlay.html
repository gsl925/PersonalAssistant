<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        cursor: crosshair;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #sel {
        position: fixed;
        border: 2px solid #3b6fd9;
        background: rgba(59, 111, 217, 0.15);
        display: none;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 14px;
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="bg" />
    <div id="dim"></div>
    <div id="sel"></div>
    <div id="hint">拖曳選取範圍截圖 · Esc 取消</div>
    <script src="overlay.js"></script>
  </body>
</html>
