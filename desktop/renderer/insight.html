<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      }
      body {
        background: #1f2023;
        color: #eee;
        padding: 14px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #333;
      }
      #row {
        display: flex;
        gap: 6px;
      }
      #input {
        flex: 1;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #111;
        color: #eee;
        font-size: 13px;
      }
      button {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #2a2b2f;
        color: #eee;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary {
        background: #3b6fd9;
        border-color: #3b6fd9;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #result {
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 1.5;
        max-height: 150px;
        overflow-y: auto;
        display: none;
      }
      #resultTitle {
        font-weight: 600;
        margin-bottom: 4px;
      }
      #actions {
        margin-top: 8px;
        display: none;
        gap: 6px;
      }
      #status {
        font-size: 11px;
        color: #6fa0ff;
        margin-top: 6px;
        height: 14px;
      }
      #hint {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="row">
      <input id="input" type="text" placeholder="貼上文章/影片連結… (Enter 產生洞察)" autofocus />
      <button id="go" class="primary">產生洞察</button>
    </div>
    <div id="result">
      <div id="resultTitle"></div>
      <div id="resultInsight"></div>
    </div>
    <div id="actions">
      <button id="save" class="primary">💾 收藏</button>
      <button id="discard">關閉</button>
    </div>
    <div id="status"></div>
    <div id="hint">Esc 關閉</div>
    <script src="insight.js"></script>
  </body>
</html>
