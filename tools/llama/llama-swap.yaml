# llama-swap config: one OpenAI-compatible endpoint that starts/stops llama-server
# per model on demand. Model ids below are the same names the capability tiers use
# (backend/config.py), so switching engines never means renaming anything.
#
# Paths are relative to the repo root - start_llama.bat cd's there first.
# GGUF files live in %LLM_MODELS_DIR% (start_llama.bat defaults it to data/llm_models/ in this repo);
# see download_models.ps1.
# Validate after editing:  tools\llama\bin\llama-swap\llama-swap.exe -config tools\llama\llama-swap.yaml -validate

healthCheckTimeout: 300   # a 17 GB model can take a while to read from disk
logToStdout: "proxy"
startPort: 18001          # upstream llama-server ports are assigned from here via ${PORT}

# Unload a model after 10 idle minutes so the GPU is free for other apps.
# Models in the "resident" group below are never unloaded.
globalTTL: 600

macros:
  # --fit (llama-server default, on) shrinks whatever is not set explicitly -
  # GPU layers, MoE expert placement - to fit free VRAM, so nothing here pins -ngl.
  llama: >
    tools/llama/bin/llama.cpp/llama-server.exe
    --host 127.0.0.1 --port ${PORT} --jinja
  models: ${env.LLM_MODELS_DIR}

models:
  "qwen3:8b":
    cmd: |
      ${llama}
      -m ${models}/Qwen3-8B-Q4_K_M.gguf
      -c 16384 --temp 0.6 --top-p 0.95 --top-k 20

  "deepseek-r1:14b":
    cmd: |
      ${llama}
      -m ${models}/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
      -c 16384 --temp 0.6 --top-p 0.95

  # 26B MoE (~4B active). 17 GB of weights vs ~15 GB free VRAM: --fit keeps the
  # attention/dense layers on the GPU and spills experts to system RAM.
  "gemma4:26b":
    cmd: |
      ${llama}
      -m ${models}/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
      -c 16384

  "qwen3-vl:8b":
    cmd: |
      ${llama}
      -m ${models}/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --mmproj ${models}/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      -c 8192

  # dev_agent (backend/tasks/dev_agent.py): 30B MoE (~3B active) coder with tool
  # calling. --jinja (in the llama macro) is what turns its tool calls into
  # structured `tool_calls`. Sampling follows Qwen's model card; dev_agent
  # overrides temperature per request.
  "qwen3-coder:30b":
    cmd: |
      ${llama}
      -m ${models}/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      -c 32768 --top-p 0.8 --top-k 20 --repeat-penalty 1.05

  # MiniCPM-V 2.6: what Ollama's minicpm-v:8b tag is, so OCR behaviour matches
  # the 2026-07-28 test noted in backend/config.py.
  "minicpm-v:8b":
    cmd: |
      ${llama}
      -m ${models}/minicpm-v-2_6.gguf
      --mmproj ${models}/minicpm-v-2_6-mmproj-f16.gguf
      -c 8192

  # F16 like Ollama's bge-m3, to keep vectors as close as possible to the ones
  # already stored. Batch sizes must cover the longest input (8192 tokens).
  "bge-m3":
    ttl: 0
    cmd: |
      ${llama}
      -m ${models}/bge-m3-F16.gguf
      --embedding --pooling cls -c 8192 -b 8192 -ub 8192

# One chat/vision model at a time (swap); bge-m3 stays loaded alongside and is
# never evicted, since embeddings are requested constantly during ingestion.
routing:
  router:
    use: group
    settings:
      groups:
        "llm":
          swap: true
          exclusive: false
          members:
            - "qwen3:8b"
            - "deepseek-r1:14b"
            - "gemma4:26b"
            - "qwen3-vl:8b"
            - "qwen3-coder:30b"
            - "minicpm-v:8b"
        "resident":
          persistent: true
          swap: false
          exclusive: false
          members:
            - "bge-m3"
